# Next.js client — app.pcsmonthlypla.online
# Install: sudo ln -sf /path/to/yohto-cleaning-service/deploy/nginx/yohto-app.conf /etc/nginx/sites-enabled/
# Test:    sudo nginx -t && sudo systemctl reload nginx

upstream yohto_client {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.pcsmonthlypla.online;

    # Certbot: sudo certbot --nginx -d app.pcsmonthlypla.online
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.pcsmonthlypla.online;

    # Certbot fills these paths after: sudo certbot --nginx -d app.pcsmonthlypla.online
    ssl_certificate     /etc/letsencrypt/live/app.pcsmonthlypla.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.pcsmonthlypla.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (Cloudflare may add others)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://yohto_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

