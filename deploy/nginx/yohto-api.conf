# Express API — api.pcsmonthlypla.online
# Install: sudo ln -sf /path/to/yohto-cleaning-service/deploy/nginx/yohto-api.conf /etc/nginx/sites-enabled/
# Test:    sudo nginx -t && sudo systemctl reload nginx

upstream yohto_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.pcsmonthlypla.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.pcsmonthlypla.online;

    ssl_certificate     /etc/letsencrypt/live/api.pcsmonthlypla.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pcsmonthlypla.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://yohto_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
